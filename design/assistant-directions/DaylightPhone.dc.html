<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Archivo:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; font-family: Archivo, "Helvetica Neue", Arial, sans-serif; font-size: 14px; line-height: 1.5; }
    a { color: #A8560F; text-decoration: none; }
    .fig { font-family: "Instrument Serif", Georgia, "Times New Roman", serif; font-variant-numeric: lining-nums; }
    .eyebrow { font-size: 10px; font-weight: 600; letter-spacing: .15em; text-transform: uppercase; }
    .paper { background: #FFFDF8; border: 1px solid #E5DCCA; box-shadow: 0 1px 0 rgba(255,255,255,.9) inset, 0 12px 22px -18px rgba(52,38,16,.55); }
  </style>
</helmet>

<div style="display: flex; flex-direction: column; width: 390px; height: 844px; background: #F7F2E8; color: #17201C; overflow: hidden">

  <div style="position: relative; flex-shrink: 0; padding: 20px 20px 30px; background: linear-gradient(152deg, #0F5147 0%, #103A33 62%, #0C2B26 100%); overflow: hidden">
    <div style="position: absolute; right: -110px; top: -140px; width: 420px; height: 420px; border-radius: 50%; background: radial-gradient(closest-side, rgba(232,154,71,.3), transparent 70%)"></div>
    <div style="position: relative; display: flex; align-items: center; justify-content: space-between">
      <div style="display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 9px; background: #F7F2E8; color: #0F5147; font-family: 'Instrument Serif'; font-size: 19px">F</div>
      <div style="display: flex; align-items: center; gap: 7px; padding: 6px 12px; border-radius: 999px; border: 1px solid rgba(247,242,232,.22)">
        <span style="width: 5px; height: 5px; border-radius: 50%; background: #E89A47"></span>
        <span style="font-size: 11px; color: rgba(247,242,232,.72)">Preview</span>
      </div>
    </div>
    <div style="position: relative; margin-top: 22px">
      <div class="eyebrow" style="color: rgba(247,242,232,.55)">Good evening, Arielle · Take-home</div>
      <div style="display: flex; align-items: flex-start; gap: 12px; margin-top: 4px">
        <span class="fig" style="font-size: 72px; line-height: .9; letter-spacing: -.02em; color: #F7F2E8">$2,732</span>
        <span class="eyebrow" style="margin-top: 8px; padding: 4px 9px; border-radius: 999px; background: rgba(190,176,255,.18); border: 1px solid rgba(190,176,255,.42); color: #D3C9FF">Incomplete</span>
      </div>
      <div style="margin-top: 14px; font-size: 13.5px; color: rgba(247,242,232,.78)">Before income tax. Withholding is not confirmed, so this is a floor, not a paycheck.</div>
      <a href="#" style="display: inline-block; margin-top: 10px; font-size: 12.5px; font-weight: 500; color: #F0C08A">Confirm withholding</a>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 11px; padding: 22px 20px 0">
    <sc-for list="{{items}}" as="i" hint-placeholder-count="2">
      <div class="paper" style="padding: 15px 17px; border-radius: 4px">
        <div class="eyebrow" style="color: #A8560F">{{i.kind}}</div>
        <div class="fig" style="margin-top: 7px; font-size: 21px; line-height: 1.15">{{i.title}}</div>
        <div style="margin-top: 5px; font-size: 12px; color: #5B665F">{{i.blocks}}</div>
      </div>
    </sc-for>
  </div>

  <div style="flex-grow: 1"></div>

  <div style="padding: 0 16px 14px">
    <div class="paper" style="border-radius: 4px; padding: 13px 16px 10px">
      <div style="font-size: 15px; color: #8A9289">Ask about your money…</div>
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 12px">
        <div style="display: flex; align-items: center; gap: 6px; height: 40px; padding: 0 13px; border-radius: 3px; border: 1px solid #E5DCCA; font-size: 12.5px; color: #4A554F">My money
          <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="#8A9289" stroke-width="2" stroke-linecap="round"><path d="m6 9 6 6 6-6"></path></svg>
        </div>
        <div style="display: flex; align-items: center; gap: 7px">
          <div style="display: flex; align-items: center; justify-content: center; width: 46px; height: 46px; border-radius: 3px; border: 1px solid #E5DCCA">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#4A554F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3M9 21h6"></path></svg>
          </div>
          <div style="display: flex; align-items: center; justify-content: center; width: 46px; height: 46px; border-radius: 3px; background: linear-gradient(155deg, #E08B33, #AF580E); box-shadow: 0 10px 18px -10px rgba(175,88,14,.8)">
            <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="#FFF8EE" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13m-5-5 5 5-5 5"></path></svg>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid #E5DCCA; background: #FFFDF8">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 12px 0 15px">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="{{t.fg}}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="{{t.d}}"></path></svg>
        <span style="font-size: 10px; color: {{t.fg}}">{{t.label}}</span>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>

<script data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return {
      items: [
        { kind: 'Blocks an exact answer', title: 'Confirm your withholding', blocks: 'Take-home stays a floor until a pay stub sets the figure.' },
        { kind: 'Blocks a food answer', title: 'Set your food target', blocks: '$53 spent this month against no target.' },
      ],
      tabs: [
        { label: 'Assistant', d: 'M4 6h16v10H10l-4 4v-4H4zM8 10h8M8 13h5', fg: '#0F5147' },
        { label: 'Money', d: 'M3 7h18v10H3zM3 11h18M7 15h3M12 7V5M12 19v-2', fg: '#8A9289' },
        { label: 'Activity', d: 'M4 18 9 11l4 4 3-5 4 6M4 6h16', fg: '#8A9289' },
        { label: 'Documents', d: 'M7 3h7l4 4v14H7zM14 3v4h4M10 12h6M10 16h6', fg: '#8A9289' },
      ],
    };
  }
}
</script>
</body>
</html>
